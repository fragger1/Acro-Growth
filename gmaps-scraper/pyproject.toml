[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaps-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["supabase>=2.10,<3", "python-dotenv>=1.0", "httpx>=0.27", "curl_cffi>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gmaps = "gmaps.cli:main"

[tool.setuptools]
packages = ["gmaps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
